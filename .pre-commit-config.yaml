# Pre-commit hooks configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff: Fast Python linter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.13
    hooks:
      - id: ruff
        name: ruff lint (strict)
        args: [--fix, --select=E,W,F,I,B,SIM,C90,N]
        stages: [commit]
      - id: ruff-format
        name: ruff format
        stages: [commit]

  # Trailing whitespace and EOF newline
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end of file
      - id: check-yaml
        name: validate YAML
        args: [--safe]
      - id: check-json
        name: validate JSON
      - id: check-merge-conflict
        name: check merge conflicts
      - id: check-case-conflict
        name: check case conflicts
      - id: detect-private-key
        name: detect private keys
      - id: mixed-line-ending
        name: mixed line ending
        args: [--fix=lf]

  # pytest: Run tests before commit
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest (critical tests)
        entry: bash -c 'python3 -m pytest tests/test_vetdict_api.py tests/test_diagnostic_chat.py -x --tb=short -q'
        language: system
        types: [python]
        stages: [commit]
        pass_filenames: false
        verbose: true

  # Security: Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: detect secrets
        args: [--baseline, .secrets.baseline]
        exclude: '^(?:\.)?secrets?\.json$|^tests/fixtures/'

# Configuration
default_language_version:
  python: python3.11

default_stages: [commit]
minimum_pre_commit_version: '2.15.0'
