[tool.poetry]
name = "vetdict"
version = "5.0.0"
description = "Multi-Species Veterinary Diagnostic Platform"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9"
flask = ">=3.0"
flask-cors = ">=4.0"
fastapi = ">=0.109.0"
uvicorn = ">=0.27.0"
pydantic = ">=2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "vetdict"
version = "5.0.0"
description = "Multi-Species Veterinary Diagnostic Platform"
requires-python = ">=3.9"
dependencies = ["flask>=3.0", "flask-cors>=4.0"]

[project.scripts]
vetdict = "app:main"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C90",    # McCabe complexity
    "N",      # pep8-naming
]
ignore = [
    "E501",   # line too long (handled gradually)
    "E741",   # ambiguous variable name
    "E402",   # module-level import not at top (sys.path setup pattern)
    "SIM103", # needless-bool (readability preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
    "C901",   # function is too complex (legacy functions — address gradually)
    "N806",   # variable in function should be lowercase (intentional CONST/Class aliases)
    "N811",   # constant imported as non-constant (intentional local aliasing pattern)
]

# Unfixable rules (manual review required)
unfixable = ["F841", "F842"]  # Unused variables must be manually fixed

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=api --cov-fail-under=60 --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["api"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
skip_covered = false
