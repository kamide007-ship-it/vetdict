<section class="pricing-section" id="pricingSection">
  <div class="pricing-header">
    <h2 class="pricing-title">VetDict</h2>
    <p class="pricing-subtitle">現在オープンベータ — 全機能を無料でご利用いただけます</p>
  </div>
  <div class="pricing-cards">
    <!-- Current: All Free -->
    <div class="pricing-card pricing-card-pro">
      <div class="pricing-badge">オープンベータ</div>
      <div class="pricing-card-header">
        <h3>全機能無料</h3>
        <div class="pricing-price">
          <span class="pricing-amount">&yen;0</span>
          <span class="pricing-period" style="text-decoration:line-through;color:var(--gray-400)">&yen;980/月</span>
        </div>
      </div>
      <ul class="pricing-features">
        <li>症状チェッカー（全21動物種）</li>
        <li>疾患データベース<strong>無制限</strong>閲覧</li>
        <li>薬品辞書<strong>フルアクセス</strong></li>
        <li>AI症状相談チャット<strong>無制限</strong></li>
        <li>詳細な鑑別診断レポート</li>
        <li>全動物種対応（犬・猫・馬・魚 他）</li>
      </ul>
      <div class="pricing-cta">
        <span class="pricing-btn pricing-btn-pro" style="background:var(--green);pointer-events:none">現在すべて無料でご利用中</span>
        <p class="pricing-note">正式リリース後は一部機能が有料プラン（¥980/月）に移行予定です</p>
        <!-- Email signup for launch notification -->
        <div class="email-signup" id="emailSignup">
          <p class="email-signup-label">正式リリース時に通知を受け取る</p>
          <div class="email-signup-row">
            <input type="email" id="signupEmail" placeholder="メールアドレス" class="email-signup-input">
            <button class="email-signup-btn" id="signupBtn">登録</button>
          </div>
          <p class="email-signup-msg" id="signupMsg"></p>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
function submitEmailSignup(){
  var email=document.getElementById("signupEmail").value.trim();
  var msg=document.getElementById("signupMsg");
  var btn=document.getElementById("signupBtn");
  if(!email||email.indexOf("@")<0){msg.textContent="有効なメールアドレスを入力してください";msg.className="email-signup-msg error";return;}
  btn.textContent="登録中...";btn.disabled=true;
  fetch("/api/paypal/waitlist",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.status==="ok"){
      msg.textContent="登録完了！正式リリース時にお知らせします。";
      msg.className="email-signup-msg success";
      btn.textContent="登録済み";
      document.getElementById("signupEmail").disabled=true;
      if(typeof trackEvent==="function")trackEvent("waitlist_signup",{email_domain:email.split("@")[1]});
    } else {
      msg.textContent=d.error||"エラーが発生しました";
      msg.className="email-signup-msg error";
      btn.textContent="登録";btn.disabled=false;
    }
  }).catch(function(){
    msg.textContent="通信エラー";msg.className="email-signup-msg error";
    btn.textContent="登録";btn.disabled=false;
  });
}
document.getElementById("signupBtn").addEventListener("click",submitEmailSignup);
</script>
