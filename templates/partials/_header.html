<header class="header">
  <div class="header-inner">
    <a href="/" class="header-logo" aria-label="VetDict ホーム">
      <div>
        <div class="logo-text"><span class="logo-vet">Vet</span><span class="logo-dict">Dict</span></div>
        <span class="logo-sub" data-i18n="logoSub">獣医師のための臨床意思決定支援</span>
      </div>
    </a>
    <div class="global-search-container">
      <div class="search-input-group">
        <input type="search" id="globalSearch"
               placeholder="疾患を検索..."
               aria-label="疾患を検索"
               class="global-search-input"
               autocomplete="off">
        <button class="search-filter-btn" id="searchFilterBtn"
                aria-label="動物種でフィルター"
                title="動物種で絞り込み"
                type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M22 3H2l8 9.46v7.54l6 2v-9.54L22 3z"/>
          </svg>
        </button>
        <button class="search-filter-btn" id="categoryFilterBtn"
                aria-label="カテゴリーでフィルター"
                title="症状カテゴリーで絞り込み"
                type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
        </button>
      </div>
      <div id="globalSearchResults" class="global-search-results" style="display:none" role="listbox"></div>
      <div id="speciesFilterPanel" class="species-filter-panel" style="display:none" role="dialog" aria-label="動物種フィルター">
        <div class="filter-header">
          <h3>動物種で絞り込み</h3>
          <button class="filter-close" id="filterCloseBtn" type="button" aria-label="閉じる">×</button>
        </div>
        <div id="speciesFilterList" class="species-filter-list"></div>
        <div class="filter-actions">
          <button id="filterResetBtn" class="filter-reset-btn" type="button">リセット</button>
        </div>
      </div>
      <div id="categoryFilterPanel" class="category-filter-panel" style="display:none" role="dialog" aria-label="症状カテゴリーフィルター">
        <div class="filter-header">
          <h3>症状カテゴリーで絞り込み</h3>
          <button class="filter-close" id="categoryFilterCloseBtn" type="button" aria-label="閉じる">×</button>
        </div>
        <div id="categoryFilterList" class="category-filter-list"></div>
        <div class="filter-actions">
          <button id="categoryFilterResetBtn" class="filter-reset-btn" type="button">リセット</button>
        </div>
      </div>
    </div>
    <button class="hamburger" aria-label="メニューを開く" aria-expanded="false" aria-controls="mainNav" id="hamburgerBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav class="header-nav" id="mainNav" role="tablist" aria-label="メインナビゲーション">
      <button role="tab" aria-selected="true" data-view="checker" id="tab-checker" aria-controls="viewChecker" data-i18n="navChecker">鑑別診断</button>
      <button role="tab" aria-selected="false" data-view="database" id="tab-database" aria-controls="viewDatabase" data-i18n="navDatabase">疾患データベース</button>
      <button role="tab" aria-selected="false" data-view="chat" id="tab-chat" aria-controls="viewChat" data-i18n="navChat">臨床相談</button>
      <button role="tab" aria-selected="false" data-view="drugs" id="tab-drugs" aria-controls="viewDrugs" data-i18n="navDrugs">薬品辞書</button>
      <button role="tab" aria-selected="false" data-view="anesthesia" id="tab-anesthesia" aria-controls="viewAnesthesia" data-i18n="navAnesthesia">鎮静・麻酔</button>
    </nav>
    <div class="lang-toggle" role="radiogroup" aria-label="Language">
      <button class="active" data-lang="ja" role="radio" aria-checked="true">JP</button>
      <button data-lang="en" role="radio" aria-checked="false">EN</button>
    </div>
  </div>
</header>
